name: Scheduled verification

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-verification
  cancel-in-progress: true

jobs:
  full-platform:
    name: Full suite (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1/1
          - os: macos-latest
            shard: 1/1
          # Keep native filesystem suites serial, with parallelism across runners.
          - os: windows-latest
            shard: 1/3
          - os: windows-latest
            shard: 2/3
          - os: windows-latest
            shard: 3/3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        id: tests
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          SCRIPT_SELECTION: ${{ startsWith(matrix.shard, '1/') && 'null' || '[]' }}
        run: |
          worker_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then worker_args=(--maxWorkers=1); fi
          npm run test -- --script-selection "$SCRIPT_SELECTION" "${worker_args[@]}" --shard="$TEST_SHARD" --json --outputFile=test-results/jest.json

      - name: Summarize test timings
        if: always() && steps.tests.outcome != 'skipped'
        run: node scripts/summarize-jest-results.mjs test-results/jest.json test-results/timings

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: jest-full-timings-${{ runner.os }}-${{ strategy.job-index }}
          path: test-results/timings/
          if-no-files-found: error
          retention-days: 14

      - name: Build production plugin
        if: startsWith(matrix.shard, '1/')
        run: npm run build

  open-handles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect Jest lifecycle leaks
        run: npm run check:open-handles

  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
