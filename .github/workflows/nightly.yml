name: Scheduled verification

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-verification
  cancel-in-progress: true

jobs:
  full-platform:
    name: Full suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        id: tests
        run: npm run test -- --json --outputFile=test-results/jest.json

      - name: Summarize test timings
        if: always() && steps.tests.outcome != 'skipped'
        run: node scripts/summarize-jest-results.mjs test-results/jest.json test-results/timings

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: jest-full-timings-${{ runner.os }}
          path: test-results/timings/
          if-no-files-found: error
          retention-days: 14

      - name: Verify published LAN compatibility
        run: npm run test:lan-compatibility

      - name: Build production plugin
        run: npm run build

  open-handles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect Jest lifecycle leaks
        run: npm run check:open-handles

  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
