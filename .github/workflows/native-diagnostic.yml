name: Native cleanup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Reproduce cleanup on Windows
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Cleanup diagnostic attempt $attempt"
            npm run test:unit -- --runInBand --runTestsByPath tests/integration/app/collab/gates/ProjectUpdateContentMilestoneGate.test.ts || exit "$?"
          done
