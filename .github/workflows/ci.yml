name: CI

on:
  push:
    branches: [main, codex/cloud-integration]
  pull_request:
    branches: [main, codex/cloud-integration]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check Bun lockfile
        run: npm run check:lockfile

      - name: Check npm lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: node scripts/audit-dependencies.mjs

  diff-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  selected-tests:
    needs: test-scope
    if: needs.test-scope.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-scope.outputs.test-shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install libfaketime
        run: sudo apt-get install -y --no-install-recommends faketime

      # Run about three years ahead so a test that depends on today's date fails here, not on the day its fixture expires.
      - name: Test
        id: tests
        timeout-minutes: 5
        env:
          FAKETIME_DONT_FAKE_MONOTONIC: '1'
          # Native process tests kill children. A killed stat() call can leave
          # libfaketime's shared semaphore locked across the entire process tree.
          # A relative offset needs no shared ticking clock.
          FAKETIME_DISABLE_SHM: '1'
          TEST_SELECTION: ${{ needs.test-scope.outputs.test-files }}
          SCRIPT_SELECTION: ${{ matrix.shard == '2/2' && '[]' || needs.test-scope.outputs.script-tests }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          faketime -m -f +1100d npm run test -- --selection "$TEST_SELECTION" --script-selection "$SCRIPT_SELECTION" --shard="$TEST_SHARD" --maxWorkers=3 --reporter=default --reporter=json --outputFile=test-results/vitest.json

      - name: Show interrupted test progress
        if: always() && steps.tests.outcome != 'success'
        run: |
          if [ -f test-results/vitest.json.progress.json ]; then
            cat test-results/vitest.json.progress.json
          fi

      - name: Summarize test timings
        if: always() && hashFiles('test-results/vitest.json') != ''
        run: node scripts/summarize-vitest-results.mjs test-results/vitest.json test-results/timings

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped' && needs.test-scope.outputs.test-files != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-timings-${{ strategy.job-index }}
          path: |
            test-results/timings/
            test-results/vitest.json.progress.json
          if-no-files-found: error
          retention-days: 14

  test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test-files: ${{ steps.scope.outputs.test-files }}
      test-shards: ${{ steps.scope.outputs.test-shards }}
      script-tests: ${{ steps.scope.outputs.script-tests }}
      cross-platform-tests: ${{ steps.scope.outputs.cross-platform-tests }}
      pi-windows: ${{ steps.scope.outputs.pi-windows }}
      wsl-windows: ${{ steps.scope.outputs.wsl-windows }}
      has-tests: ${{ steps.scope.outputs.has-tests }}
      cross-platform: ${{ steps.scope.outputs.cross-platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm ci

      - name: Select affected tests and platform checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ciTestSelection.mjs

  test:
    needs: [test-scope, selected-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected tests
        env:
          SCOPE_RESULT: ${{ needs.test-scope.result }}
          TEST_RESULT: ${{ needs.selected-tests.result }}
          HAS_TESTS: ${{ needs.test-scope.outputs.has-tests }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi

  cross-platform-smoke:
    needs: test-scope
    if: needs.test-scope.outputs.cross-platform == 'true'
    name: Cross-platform tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The selected script suite normally includes this check; retain it for script-only changes.
      - name: Run Windows architecture boundaries
        if: runner.os == 'Windows' && needs.test-scope.outputs.script-tests != 'null' && !contains(fromJSON(needs.test-scope.outputs.script-tests), 'scripts/check-architecture-boundaries.test.mjs')
        run: npm run test:architecture

      - name: Run affected Windows script checks
        if: runner.os == 'Windows'
        shell: bash
        env:
          SCRIPT_SELECTION: ${{ needs.test-scope.outputs.script-tests }}
        run: npm run test -- --selection '[]' --script-selection "$SCRIPT_SELECTION"

      - name: Build production plugin
        run: npm run build

      - name: Run affected platform and real-process tests
        id: native-tests
        shell: bash
        env:
          TEST_SELECTION: ${{ needs.test-scope.outputs.cross-platform-tests }}
          TEST_WORKERS: ${{ runner.os == 'Windows' && '1' || '3' }}
        run: |
          mkdir -p test-results
          npm run test:cross-platform -- --selection "$TEST_SELECTION" --maxWorkers="$TEST_WORKERS" --reporter=default --reporter=json --outputFile=test-results/native.json

      - name: Summarize native test timings
        if: always() && steps.native-tests.outcome != 'skipped' && needs.test-scope.outputs.cross-platform-tests != '[]'
        run: node scripts/summarize-vitest-results.mjs test-results/native.json test-results/native-timings

      - name: Upload native test timings
        if: always() && steps.native-tests.outcome != 'skipped' && needs.test-scope.outputs.cross-platform-tests != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-native-timings-${{ runner.os }}-${{ strategy.job-index }}
          path: test-results/native-timings/
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows Pi launch integration
        if: runner.os == 'Windows' && needs.test-scope.outputs.pi-windows == 'true'
        run: npm run test:unit -- --maxWorkers=1 tests/integration/providers/pi/runtime/PiSubprocess.windows.test.ts

  wsl-native:
    needs: test-scope
    if: needs.test-scope.outputs.wsl-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # WSL1 avoids a nested virtualization requirement on hosted runners.
      # This verifies launch/filesystem/env mechanics, not WSL2 NAT networking.
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: bash zsh csh tcsh fish curl ca-certificates python3
          wsl-version: '1'
          set-as-default: 'true'

      - name: Provision Linux Node for native WSL fixtures
        shell: pwsh
        run: |
          $installer = @'
          set -eu
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          # Ubuntu's Node ELF has 8 KiB LOAD alignment, rejected by WSL1.
          # This official build uses 4 KiB alignment for every LOAD segment.
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz -o "$archive"
          echo "9d942932535988091034dc94cc5f42b6dc8784d6366df3a36c4c9ccb3996f0c2  $archive" | sha256sum -c -
          mkdir -p /opt/claudian-wsl-node /usr/local/bin
          tar -xzf "$archive" --strip-components=1 -C /opt/claudian-wsl-node
          ln -sf /opt/claudian-wsl-node/bin/node /usr/local/bin/node
          /usr/local/bin/node --version
          /usr/local/bin/node -e 'if (process.platform !== "linux" || process.arch !== "x64") process.exit(1)'
          '@
          # PowerShell pipes CRLF line endings; strip them before sh parses the script.
          $installer | wsl --exec /bin/sh -c "tr -d '\r' | /bin/sh"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies on Windows
        run: npm ci

      - name: Exercise native Windows to WSL execution
        env:
          CLAUDIAN_REQUIRE_WSL: '1'
        run: npm run test:unit -- --maxWorkers=1 tests/integration/core/process/execution-target/WSLExecution.windows.test.ts tests/integration/core/process/execution-target/WSLSessionToolRelay.windows.test.ts tests/integration/core/process/execution-target/ClaudeWSL.windows.test.ts

  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Build and inspect production artifacts
        run: npm run build && npm run check:performance

      - name: Upload verified release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  build:
    needs: [quality, test, build-artifacts, test-scope, wsl-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality, tests and production artifacts
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-artifacts.result }}
          WSL_RESULT: ${{ needs.wsl-native.result }}
          WSL_REQUIRED: ${{ needs.test-scope.outputs.wsl-windows }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
          if [ "$WSL_REQUIRED" = true ]; then
            test "$WSL_RESULT" = success
          else
            test "$WSL_RESULT" = skipped
          fi
