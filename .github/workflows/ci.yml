name: CI

on:
  push:
    branches: [main, codex/cloud-integration]
  pull_request:
    branches: [main, codex/cloud-integration]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check Bun lockfile
        run: npm run check:lockfile

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  diff-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  selected-tests:
    needs: test-scope
    if: needs.test-scope.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-scope.outputs.test-shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install libfaketime
        run: sudo apt-get install -y --no-install-recommends faketime

      # Run about three years ahead so a test that depends on today's date fails here, not on the day its fixture expires.
      - name: Test
        id: tests
        env:
          FAKETIME_DONT_FAKE_MONOTONIC: '1'
          TEST_SELECTION: ${{ needs.test-scope.outputs.test-files }}
          SCRIPT_SELECTION: ${{ matrix.shard == '2/2' && '[]' || needs.test-scope.outputs.script-tests }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          faketime -f +1100d npm run test -- --selection "$TEST_SELECTION" --script-selection "$SCRIPT_SELECTION" --shard="$TEST_SHARD" --maxWorkers=3 --json --outputFile=test-results/jest.json

      - name: Summarize test timings
        if: always() && steps.tests.outcome != 'skipped' && needs.test-scope.outputs.test-files != '[]'
        run: node scripts/summarize-jest-results.mjs test-results/jest.json test-results/timings

      - name: Upload test timings
        if: always() && steps.tests.outcome != 'skipped' && needs.test-scope.outputs.test-files != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: jest-timings-${{ strategy.job-index }}
          path: test-results/timings/
          if-no-files-found: error
          retention-days: 14

  test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test-files: ${{ steps.scope.outputs.test-files }}
      test-shards: ${{ steps.scope.outputs.test-shards }}
      script-tests: ${{ steps.scope.outputs.script-tests }}
      cross-platform-tests: ${{ steps.scope.outputs.cross-platform-tests }}
      cross-platform-shards: ${{ steps.scope.outputs.cross-platform-shards }}
      pi-windows: ${{ steps.scope.outputs.pi-windows }}
      has-tests: ${{ steps.scope.outputs.has-tests }}
      lan: ${{ steps.scope.outputs.lan }}
      cross-platform: ${{ steps.scope.outputs.cross-platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select affected tests and platform checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ciTestSelection.mjs

  lan-compatibility:
    needs: test-scope
    if: needs.test-scope.outputs.lan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify published LAN compatibility
        run: npm run test:lan-compatibility

  test:
    needs: [test-scope, selected-tests, lan-compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected tests and applicable LAN compatibility
        env:
          SCOPE_RESULT: ${{ needs.test-scope.result }}
          TEST_RESULT: ${{ needs.selected-tests.result }}
          HAS_TESTS: ${{ needs.test-scope.outputs.has-tests }}
          LAN_RESULT: ${{ needs.lan-compatibility.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi
          test "$LAN_RESULT" = success || test "$LAN_RESULT" = skipped

  cross-platform-smoke:
    needs: test-scope
    if: needs.test-scope.outputs.cross-platform == 'true'
    name: Cross-platform tests (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: ${{ fromJSON(needs.test-scope.outputs.cross-platform-shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows architecture boundaries
        if: runner.os == 'Windows'
        run: npm run test:architecture

      - name: Run affected Windows script checks
        if: runner.os == 'Windows' && startsWith(matrix.shard, '1/')
        shell: bash
        env:
          SCRIPT_SELECTION: ${{ needs.test-scope.outputs.script-tests }}
        run: npm run test -- --selection '[]' --script-selection "$SCRIPT_SELECTION"

      - name: Build production plugin
        run: npm run build

      - name: Run affected OS-sensitive tests
        id: native-tests
        shell: bash
        env:
          TEST_SELECTION: ${{ needs.test-scope.outputs.cross-platform-tests }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          npm run test:cross-platform-collab -- --selection "$TEST_SELECTION" --shard="$TEST_SHARD" --maxWorkers=3 --json --outputFile=test-results/native.json

      - name: Summarize native test timings
        if: always() && steps.native-tests.outcome != 'skipped' && needs.test-scope.outputs.cross-platform-tests != '[]'
        run: node scripts/summarize-jest-results.mjs test-results/native.json test-results/native-timings

      - name: Upload native test timings
        if: always() && steps.native-tests.outcome != 'skipped' && needs.test-scope.outputs.cross-platform-tests != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: jest-native-timings-${{ runner.os }}-${{ strategy.job-index }}
          path: test-results/native-timings/
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows Pi launch integration
        if: runner.os == 'Windows' && matrix.shard != '2/2' && needs.test-scope.outputs.pi-windows == 'true'
        run: npm run test:unit -- --runInBand tests/integration/providers/pi/PiSubprocess.windows.test.ts

  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and inspect production artifacts
        run: npm run build && npm run check:performance

  build:
    needs: [quality, test, build-artifacts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality, tests and production artifacts
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-artifacts.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
