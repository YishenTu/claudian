name: Windows and Linux worker benchmark

on:
  push:
    branches: [repo-test-optimization-plan]
    paths: [.github/workflows/test-worker-benchmark.yml]

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shard: '1/1'
            order: '2,3'
          - os: windows-latest
            shard: '1/1'
            order: '3,2'
          - os: ubuntu-latest
            shard: '1/2'
            order: '2,3'
          - os: ubuntu-latest
            shard: '2/2'
            order: '2,3'
          - os: ubuntu-latest
            shard: '1/2'
            order: '3,2'
          - os: ubuntu-latest
            shard: '2/2'
            order: '3,2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run build
      - name: Compare worker counts
        shell: pwsh
        env:
          WORKER_ORDER: ${{ matrix.order }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $failed = $false
          foreach ($workers in $env:WORKER_ORDER.Split(',')) {
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            if ($env:RUNNER_OS -eq 'Windows') {
              & npm run test:cross-platform-collab -- "--maxWorkers=$workers" --json "--outputFile=test-results/workers-$workers.json"
            } elseif ($env:TEST_SHARD -eq '2/2') {
              & npm test -- --script-selection '[]' "--shard=$env:TEST_SHARD" "--maxWorkers=$workers" --json "--outputFile=test-results/workers-$workers.json"
            } else {
              & npm test -- "--shard=$env:TEST_SHARD" "--maxWorkers=$workers" --json "--outputFile=test-results/workers-$workers.json"
            }
            $testExit = $LASTEXITCODE
            $timer.Stop()
            @{ workers = [int]$workers; elapsedSeconds = $timer.Elapsed.TotalSeconds; exitCode = $testExit; order = $env:WORKER_ORDER; shard = $env:TEST_SHARD; platform = $env:RUNNER_OS } | ConvertTo-Json | Set-Content "test-results/workers-$workers-wall.json"
            if ($testExit -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-comparison-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: error
