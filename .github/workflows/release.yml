name: Release

on:
  push:
    tags:
      - '*'

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            release-artifacts/main.js
            release-artifacts/manifest.json
            release-artifacts/styles.css

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "$PREVIOUS_TAG..HEAD" --pretty=format:"- %s" --no-merges | grep -Fvx -- "- $RELEASE_TAG" || true)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          {
            echo "notes<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/main.js
            release-artifacts/manifest.json
            release-artifacts/styles.css
